services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kenosm
      POSTGRES_PASSWORD: kenosm
      POSTGRES_DB: kenosm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenosm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
